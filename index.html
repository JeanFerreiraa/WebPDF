<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebPDF - Ferramentas de PDF Rápidas e Seguras</title>
  
  <!-- Fonte Moderna Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
  <!-- Bibliotecas PDF -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <main class="app-container">
    <!-- Cabeçalho -->
    <header class="app-header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M10 13H8v5"/><path d="M12 13v5"/><path d="M16 13h-2v5"/></svg>
        <span>Web<strong>PDF</strong></span>
      </div>
      <p class="app-subtitle">Manipule seus PDFs de forma rápida, privada e gratuita no seu navegador.</p>
    </header>

    <!-- Seleção de Ação (Abas) -->
    <nav class="tabs-nav">
      <button class="tab-btn active" onclick="selecionarAcao('juntar', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7h8M8 12h8M8 17h8"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        Unir
      </button>
      <button class="tab-btn" onclick="selecionarAcao('separar', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
        Dividir
      </button>
      <button class="tab-btn" onclick="selecionarAcao('comprimir', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        Comprimir
      </button>
    </nav>

    <!-- Zona de Drop / Upload -->
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="pdf-input" accept=".pdf" multiple class="file-input">
      <div class="drop-zone-content">
        <div class="upload-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <p class="drop-title" id="file-label">Arraste seus PDFs aqui</p>
        <p class="drop-subtitle">ou <span class="browse-link">clique para buscar no computador</span></p>
      </div>
    </div>

    <!-- Lista de Arquivos Selecionados -->
    <div id="file-list" class="file-list hidden"></div>

    <!-- Opções Dinâmicas (Dividir PDF) -->
    <div id="separar-options" class="options-card hidden">
      <label class="options-label">Intervalo de Páginas para Extrair:</label>
      <div class="range-inputs">
        <div class="input-field">
          <span>De:</span>
          <input type="number" id="page-start" min="1" value="1" placeholder="1">
        </div>
        <div class="input-field">
          <span>Até:</span>
          <input type="number" id="page-end" min="1" placeholder="Última">
        </div>
      </div>
    </div>

    <!-- Botão Principal -->
    <button id="btn-processar" class="btn-primary">
      <span class="btn-spinner hidden" id="btn-spinner"></span>
      <span id="btn-text">Processar e Baixar PDF</span>
    </button>

    <!-- Status da Operação -->
    <div id="status" class="status-banner hidden"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
